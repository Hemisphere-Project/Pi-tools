[module]
name = apfix
description = Stale-hotspot guard: restart hostapd@wint when no station is associated (90 s after boot, then every 20 min). Opt-in, off by default
group = apfix
platforms = pi

[install]
script = yes
# rerun-safe, and needed: /usr/local/sbin/apfix is a COPY (same rule as linkwatch).
rerun = yes
