[module]
name = rorw
description = Read-only root filesystem with writable /data
group = system
platforms = pi,x86

[deps]
# fsck.fat — `ro` clears the boot partition's FAT dirty flag (see README).
apt = dosfstools

[install]
script = yes

[files]
bins = ro rw fake-clock
services = fake-clock.service fake-clock-autosave.service
