[module]
name = rorw
description = Read-only root filesystem with writable /data
group = system
platforms = pi,x86

[deps]
# fsck.fat — `ro` clears the boot partition's FAT dirty flag (see README).
apt = dosfstools

[install]
script = yes
# install.sh runs ONCE (fstab from freshly probed UUIDs, cmdline.txt seds, .bashrc
# appends); upgrade.sh is its re-runnable tail, which rastaos-update re-applies.
upgrade = upgrade.sh

[files]
bins = ro rw fake-clock data-repair
services = fake-clock.service fake-clock-autosave.service data-repair.service
enable = data-repair.service
