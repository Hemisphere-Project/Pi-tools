[module]
name = network-tools
description = WiFi profile management and network forwarding
group = network
platforms = pi,x86

[deps]
# hostapd backs every mode=ap profile (setnet routes AP roles to it; NM's
# wpa_supplicant AP path is unusable by Apple clients on Broadcom fullmac).
# Online image builds get it here; offline fleet patching carries the .deb.
apt = hostapd

[files]
bins = setnet uplink-fwd
services = setnet.service uplink-fwd@.service iface-off@.service hostapd@.service
# We drive hostapd per-interface via hostapd@.service; the stock single-instance
# unit (default /etc/hostapd/hostapd.conf) must not also grab an interface.
mask = hostapd.service

[starter]
comment = Network utilities
service = setnet
