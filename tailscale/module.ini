[module]
name = tailscale
description = Tailscale VPN with RO-filesystem support
group = tailscale
platforms = pi,x86

[install]
script = yes
# NOT rerun-safe: install.sh pipes the vendor installer from the network, so an
# offline (bundle) update would fail it and every update would move tailscale
# itself to whatever is latest. tailscale-start is linked: the tag reaches it.
rerun = no

[files]
bins = tailscale-start
services = tailscale-start.service

[starter]
comment = Tailscale VPN (run 'tailscale up' once to authenticate)
service = tailscale-start
