[module]
name = audioselect
description = Audio output routing (HDMI/analog/USB)
group = audioselect
platforms = pi

[deps]
apt = alsa-utils

[files]
bins = audioselect
services = audioselect@.service
udev_rules = 70-audioselect.rules
mask = alsa-restore.service alsa-state.service

[starter]
comment = Audio output (hdmi0, analog, usb, both)
service = audioselect@both
