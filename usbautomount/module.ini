[module]
name = usbautomount
description = Auto-mount USB drives to /data/usb
group = system
platforms = pi,x86

[deps]
apt = lockfile-progs dosfstools xfsprogs hfsprogs

[files]
bins = usbautomount
services = usbautomount@.service
udev_rules = 90-usbautomount.rules
dirs = /mnt/usb0 /mnt/usb1 /mnt/usb2 /mnt/usb3 /mnt/usb4 /mnt/usb5 /mnt/usb6 /mnt/usb7
