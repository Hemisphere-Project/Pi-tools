[module]
name = audiohub
description = Audio hub: always-on multi-output (jack/HDMI/USB), absorbs audioselect
group = audiohub
platforms = pi,x86

[install]
script = yes
# rerun-safe (its header says so): /etc/asound.conf is the module's graph and is
# rewritten, /etc/audiohub.conf is config and kept; the three forwarders restart
# one at a time, so a converge on a playing box blips its audio.
rerun = yes
