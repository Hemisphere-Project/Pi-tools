# audiohub — platform audio configuration (Pi-tools audiohub module).
#
# This file marks a DEDICATED audio platform: applications (HPlayer2,
# HPlayer3, or any third party) detect it and target the hub pipeline;
# without it they must leave the audio environment untouched.
#
# This copy under /etc holds the platform defaults. To change values on a
# read-only-rootfs player, write overrides to /data/audiohub.conf (same
# key=value syntax, later file wins) — by hand or via `audiohub set` — then
# `audiohub apply`. Applications should read BOTH files, /data last.
#
# graph      : pipeline version (apps target the alsa/hplayer PCM for v2)
# latency_us : alsaloop forwarder target for EVERY output — one deterministic
#              value, compensated inside the player application (video waits
#              for audio). bcm2835 floor is 20000 (VCHIQ consumes in ~10ms
#              quanta, bench player-000 2026-07-21); the forwarder clamps.
# usb_volume : level pinned on the USB DAC's own playback mixer at every usb
#              forwarder start (amixer syntax: 0dB, 80%, -6dB; 'keep' = leave
#              the chip's remembered level). The chip's default is arbitrary:
#              two LEA players booted at -5 dB and -20 dB (2026-09-10).
graph=v2
latency_us=30000
usb_volume=0dB
