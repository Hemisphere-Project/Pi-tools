[module]
name = usbfix
description = USB-link watchdog: re-enumerate a USB device whose endpoint stalled (kernel `urb status` storm that starves a Pi 3B+: hotspot blind, timers stalled) or a silent Nowde node; keeps kernel messages out of rsyslog's tmpfs files
group = system
platforms = pi

[install]
script = yes
# rerun-safe, and needed: /usr/local/sbin/usbfix is a COPY. The imklog sed skips
# a line it already commented; --no-rsyslog is remembered in /etc/default/usbfix.
rerun = yes
