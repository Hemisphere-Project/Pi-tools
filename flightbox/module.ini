[module]
name = flightbox
description = Raw ring buffer for the post-mortem trail — p4 on a reflashed card, a reserved /data/.flightbox on a live one (flightbox reserve): sequential dd oflag=direct append, boot-time tail-scan, self-disabling on any I/O error. journal-export/blackbox write to it instead of /data.
group = system
platforms = pi

[install]
script = yes
