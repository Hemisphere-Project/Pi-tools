# HPlayer2 audio hub contract — managed by Pi-tools (hplayer-audio module).
#
# The PRESENCE of this file tells HPlayer2 that this platform runs the
# always-on multi-output audio hub (dedicated player hardware only: without
# it, HPlayer2 uses the default ALSA environment and never touches audio
# configuration — the laptop/dev case).
#
# graph      : pipeline version HPlayer2 should target (alsa/hplayer PCM)
# latency_us : alsaloop forwarder target for EVERY output — one deterministic
#              value, compensated inside the player (video waits for audio).
#              bcm2835 floor is 20000 (VCHIQ consumes in ~10ms quanta,
#              bench player-000 2026-07-21); the forwarder wrapper clamps.
graph=v2
latency_us=30000
