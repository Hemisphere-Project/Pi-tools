# blackbox v3 (2026-09-21): the journal lives in RAM again. Two SanDisk cards died in three days under
# the persistent journal's write pattern (in-place updates of 16 MB files, a sync every minute):
# LEA S06-48-P rolled back to its burn-time state, KOUAGOU's master aborted its data partition.
# Post-mortem coverage comes from journal-export (sequential appends every 10 min + a dump on
# anomaly), not from journald writing to the card.
# Budget: a log storm drops lines, it never eats the RAM — 32 MB of 8 MB files on /run.
[Journal]
Storage=volatile
Compress=yes
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M
RuntimeKeepFree=16M
RateLimitIntervalSec=30s
RateLimitBurst=1000
