# /etc/systemd/journald.conf.d/blackbox.conf — journal survives reboots, inside a hard budget.
# The directory is /data/var/log/journal (bound over /var/log/journal by journal-persist.service).
# Budget: at most 500 MB, never below 1 GB free on /data, files of 16 MB, a month of history
# (a Nowde slave logs ~15-20 MB/day of servo lines; 500 MB is the month for a slave).
# SD wear: one sync per minute (journald buffers in between); a crash loses at most a minute.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=16M
MaxRetentionSec=1month
SyncIntervalSec=60s
# chatty loggers (a NOWDE retry every 5 s, wallclock servo lines) stay readable: 1000 msgs / 30 s per unit
RateLimitIntervalSec=30s
RateLimitBurst=1000
