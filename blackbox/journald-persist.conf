# /etc/systemd/journald.conf.d/blackbox.conf — journal survives reboots, inside a hard budget.
# The directory is /data/var/log/journal (bound over /var/log/journal by journal-persist.service).
# Budget: at most 500 MB, never below 1 GB free on /data, files of 16 MB, history bounded by size only
# (a Nowde slave logs ~15-20 MB/day of servo lines; 500 MB is the month for a slave).
# SD wear: one sync per minute (journald buffers in between); a crash loses at most a minute.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=500M
SystemKeepFree=1G
SystemMaxFileSize=16M
# No MaxRetentionSec: the first file of every boot carries the pre-RTC/fake-clock timestamps of early
# boot (2019 / last saved date) as its head time, and a time-based vacuum deletes exactly that file
# - the boot's first minutes, the ones a power-cycle question is about (seen on W3, 2026-09-17:
# the 19:33-20:06 archive vanished at the first rotation). The size cap is the budget.
SyncIntervalSec=60s
# chatty loggers (a NOWDE retry every 5 s, wallclock servo lines) stay readable: 1000 msgs / 30 s per unit
RateLimitIntervalSec=30s
RateLimitBurst=1000
