[module]
name = blackbox
description = Persistent journal on /data (500 MB budget) + one line of player state per minute (blackbox.log, 32 MB ceiling), Nowde-aware: asks the node for its table / lock
group = system
platforms = pi

[install]
script = yes
# rerun-safe: ln -sf, the journald drop-in rewritten whole, v2 leftovers rm -f;
# without --now nothing restarts (the drop-in takes at the next boot).
rerun = yes
