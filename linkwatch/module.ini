[module]
name = linkwatch
description = Sync-link watchdog (30 s): dongle slave with a dead data path -> driver reload; master with a stale station -> deauth; sync AP silent -> hostapd restart / driver reload
group = network
platforms = pi

[install]
script = yes
# rerun-safe, and needed: /usr/local/sbin/linkwatch is a COPY, so a new tag
# reaches it only by running install.sh again.
rerun = yes
