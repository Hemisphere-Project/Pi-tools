[module]
name = splash
description = Boot splash screen (Pi: fbi image / x86: silent plymouth spinner)
group = core
platforms = pi,x86

# install.sh branches per platform: Pi keeps the fbi/framebuffer path
# (deps below), x86 delegates to install-x86-plymouth.sh — so the whole
# install is script-driven.
[install]
script = yes

[deps]
apt = fbi

[files]
bins = splash
services = splash.service
enable = splash.service
